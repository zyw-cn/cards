<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomelo.js H5 Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-success {
            background: #27ae60;
            color: white;
        }
        .status {
            padding: 10px 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: 500;
        }
        .status.connected {
            background: #d4edda;
            color: #155724;
        }
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        .status.connecting {
            background: #fff3cd;
            color: #856404;
        }
        .log-container {
            margin-top: 20px;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-title {
            color: #fff;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .log-item {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            padding: 5px 0;
            border-bottom: 1px solid #333;
        }
        .log-item.info { color: #58a6ff; }
        .log-item.success { color: #3fb950; }
        .log-item.error { color: #f85149; }
        .log-item.warn { color: #d29922; }
        .message-area {
            margin-top: 20px;
            display: none;
        }
        .message-area.show {
            display: block;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎮 Pomelo.js 客户端</h1>

    <!-- 连接状态 -->
    <div id="status" class="status disconnected">
        状态: 未连接
    </div>

    <!-- 连接配置 -->
    <div class="form-group">
        <label>服务器地址</label>
        <input type="text" id="host" value="127.0.0.1" placeholder="服务器IP地址">
    </div>
    <div class="form-group">
        <label>端口</label>
        <input type="number" id="port" value="9052" placeholder="端口号">
    </div>

    <!-- 连接按钮 -->
    <button id="connectBtn" class="btn btn-primary" onclick="connect()">连接服务器</button>
    <button id="disconnectBtn" class="btn btn-danger" style="display:none;" onclick="disconnect()">断开连接</button>
    <button class="btn" style="background:#9b59b6;color:white;margin-top:10px;" onclick="testRawWebSocket()">🔧 原始WebSocket测试</button>

    <!-- 消息发送区域 -->
    <div id="messageArea" class="message-area">
        <div class="form-group">
            <label>路由 (Route)</label>
            <input type="text" id="route" value="connector.entryHandler.entry" placeholder="例: connector.entryHandler.entry">
        </div>
        <div class="form-group">
            <label>消息内容 (JSON)</label>
            <input type="text" id="message" value='{"name": "test"}' placeholder='{"key": "value"}'>
        </div>
        <button class="btn btn-success" onclick="sendRequest()">发送请求 (Request)</button>
        <button class="btn btn-primary" onclick="sendNotify()" style="margin-top: 10px;">发送通知 (Notify)</button>
    </div>

    <!-- 日志输出 -->
    <div class="log-container">
        <div class="log-title">📋 日志输出</div>
        <div id="logs"></div>
    </div>
</div>

<!-- ============================================ -->
<!-- 引入 Pomelo.js 客户端 -->
<!-- ============================================ -->

<!-- 方式1: 使用 CDN (推荐) -->
<script src="https://cdn.jsdelivr.net/npm/pomelo-client-websocket@1.0.13/core.js"></script>

<!-- 方式2: 本地引入 (下载 core.js 后放到 lib 目录) -->
<!-- <script src="./lib/core.js"></script> -->

<!-- 方式3: 使用 npm + webpack 打包 -->
<!-- npm install pomelo-client-websocket -->
<!-- const Pomelo = require('pomelo-client-websocket/core'); -->

<script>
    // ============================================
    // Pomelo.js 客户端完整使用示例
    // ============================================

    // ★ 重要：需要实例化 Pomelo 对象
    let pomelo = new Pomelo();
    let isConnected = false;

    // 日志输出函数
    function log(message, type = 'info') {
        const logsDiv = document.getElementById('logs');
        const time = new Date().toLocaleTimeString();
        const logItem = document.createElement('div');
        logItem.className = `log-item ${type}`;
        logItem.textContent = `[${time}] ${message}`;
        logsDiv.insertBefore(logItem, logsDiv.firstChild);
    }

    // 更新连接状态显示
    function updateStatus(status, text) {
        const statusDiv = document.getElementById('status');
        statusDiv.className = `status ${status}`;
        statusDiv.textContent = `状态: ${text}`;
    }

    // ============================================
    // 1. 连接服务器 - pomelo.init()
    // ============================================

    // ★ 重要：事件监听器必须在 init 之前注册！
    function setupEventListeners() {
        // ★ 监听连接成功事件 (握手完成)
        pomelo.on('connect', function() {
            log('【握手成功】WebSocket 连接已建立', 'success');
            isConnected = true;
            updateStatus('connected', '已连接');
            document.getElementById('messageArea').classList.add('show');
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('disconnectBtn').style.display = 'block';
            registerEventListeners();
        });

        // ★ 监听连接错误事件
        pomelo.on('error', function(err) {
            log(`【连接错误】${err}`, 'error');
            updateStatus('disconnected', '连接错误');
        });

        // ★ 监听断开连接事件
        pomelo.on('close', function() {
            log('【连接关闭】WebSocket 已断开', 'warn');
            handleDisconnect();
        });

        // ★ 监听 IO 错误事件
        pomelo.on('io-error', function(err) {
            log(`【IO错误】${JSON.stringify(err)}`, 'error');
        });

        // ★ 监听重连事件
        pomelo.on('reconnect', function() {
            log('【重连中】正在尝试重新连接...', 'warn');
        });

        // ★ 监听握手事件
        pomelo.on('handshake', function(data) {
            log(`【握手数据】${JSON.stringify(data)}`, 'info');
            console.log('握手数据:', data);
        });

        // ★ 监听所有服务端响应 (用于调试)
        pomelo.on('__CLIENT_RESPONSE', function(route, data) {
            log(`【服务端响应】路由: ${route}`, 'info');
            log(`【响应内容】${JSON.stringify(data, null, 2)}`, 'info');
            console.log('服务端响应 - 路由:', route, '数据:', data);
        });

        // ★ 监听所有服务端推送 (用于调试)
        pomelo.on('__CLIENT_ROUTE', function(route, data) {
            log(`【服务端推送】路由: ${route}`, 'success');
            log(`【推送内容】${JSON.stringify(data, null, 2)}`, 'success');
            console.log('服务端推送 - 路由:', route, '数据:', data);
        });
    }

    // 初始化时注册事件监听
    setupEventListeners();

    function connect() {
        const host = document.getElementById('host').value;
        const port = parseInt(document.getElementById('port').value);

        if (!host || !port) {
            log('请输入服务器地址和端口', 'error');
            return;
        }

        // 如果之前有连接，先断开并创建新实例
        if (pomelo) {
            try { pomelo.disconnect(); } catch(e) {}
        }
        pomelo = new Pomelo();
        setupEventListeners();

        updateStatus('connecting', '连接中...');
        log(`【第1步】发起 WebSocket 握手请求...`, 'info');
        log(`目标地址: ws://${host}:${port}`, 'info');

        // ★ Pomelo 核心API: init - 初始化并连接服务器
        pomelo.init({
            host: host,
            port: port,
            scheme: 'ws',  // 使用 ws 协议，如果是加密连接使用 'wss'
            log: true,     // 开启日志
            // 心跳相关配置
            heartbeat: 30,      // 如果服务器返回的心跳为0，这里可以覆盖
            reconnect: true,    // 断开后自动重连
            maxReconnectAttempts: 10,
            handshakeCallback: function(data) {
                console.log('handshakeCallback 数据:', data);
                log(`【握手回调】${JSON.stringify(data)}`, 'info');
                // 返回 undefined 或 {} 而不是 true
                return {};
            }
        });
    }

    // ============================================
    // 2. 注册服务器推送事件监听 - pomelo.on()
    // ============================================
    function registerEventListeners() {
        // ★ pomelo.on(event, callback) - 监听服务器主动推送的消息
        // 事件名称需要与服务器端定义的一致

        // 示例: 监听聊天消息
        pomelo.on('onChat', function(data) {
            log(`【聊天消息】${JSON.stringify(data, null, 2)}`, 'success');
            console.log('onChat:', data);
        });

        // 示例: 监听系统通知
        pomelo.on('onNotify', function(data) {
            log(`【系统通知】${JSON.stringify(data, null, 2)}`, 'info');
            console.log('onNotify:', data);
        });

        // 示例: 监听用户加入
        pomelo.on('onUserJoin', function(data) {
            log(`【用户加入】${JSON.stringify(data, null, 2)}`, 'info');
            console.log('onUserJoin:', data);
        });

        // 示例: 监听用户离开
        pomelo.on('onUserLeave', function(data) {
            log(`【用户离开】${JSON.stringify(data, null, 2)}`, 'warn');
            console.log('onUserLeave:', data);
        });

        // 通用消息监听
        pomelo.on('onMessage', function(data) {
            log(`【通用消息】${JSON.stringify(data, null, 2)}`, 'success');
            console.log('onMessage:', data);
        });

        log('事件监听器已注册', 'info');
        log('所有服务端返回将自动打印到日志和控制台', 'info');
    }

    // ============================================
    // 3. 发送请求 - pomelo.request() (有响应)
    // ============================================
    function sendRequest() {
        if (!isConnected) {
            log('请先连接服务器', 'error');
            return;
        }

        const route = document.getElementById('route').value;
        let message;

        try {
            message = JSON.parse(document.getElementById('message').value);
        } catch(e) {
            log('消息格式错误，请输入有效的JSON', 'error');
            return;
        }

        log(`发送请求 -> ${route}: ${JSON.stringify(message)}`, 'info');

        // ★ pomelo.request(route, msg, callback) - 发送请求并等待服务器响应
        // route: 路由格式为 "服务器类型.Handler名.方法名"
        // msg: 发送的消息对象
        // callback: 收到响应后的回调函数
        pomelo.request(route, message, function(response) {
            log(`【服务端响应】路由: ${route}`, 'success');
            log(`【响应数据】${JSON.stringify(response, null, 2)}`, 'success');
            console.log('服务端响应:', response);

            // 如果有错误码，显示错误
            if (response && response.code && response.code !== 200) {
                log(`【错误码】${response.code} - ${response.msg || response.message || ''}`, 'error');
            }
        });
    }

    // ============================================
    // 4. 发送通知 - pomelo.notify() (无响应)
    // ============================================
    function sendNotify() {
        if (!isConnected) {
            log('请先连接服务器', 'error');
            return;
        }

        const route = document.getElementById('route').value;
        let message;

        try {
            message = JSON.parse(document.getElementById('message').value);
        } catch(e) {
            log('消息格式错误，请输入有效的JSON', 'error');
            return;
        }

        log(`发送通知 -> ${route}: ${JSON.stringify(message)}`, 'info');

        // ★ pomelo.notify(route, msg) - 发送通知，不等待响应
        // 适用于不需要服务器返回结果的场景
        pomelo.notify(route, message);
        log('通知已发送 (无响应)', 'info');
    }

    // ============================================
    // 5. 断开连接 - pomelo.disconnect()
    // ============================================
    function disconnect() {
        if (pomelo) {
            // ★ pomelo.disconnect() - 主动断开与服务器的连接
            pomelo.disconnect();
            log('主动断开连接', 'warn');
            handleDisconnect();
        }
    }

    // 处理断开连接后的UI更新
    function handleDisconnect() {
        isConnected = false;
        updateStatus('disconnected', '未连接');
        document.getElementById('messageArea').classList.remove('show');
        document.getElementById('connectBtn').style.display = 'block';
        document.getElementById('disconnectBtn').style.display = 'none';
    }

    // ============================================
    // 调试: 原始 WebSocket 测试
    // ============================================
    function testRawWebSocket() {
        const host = document.getElementById('host').value;
        const port = parseInt(document.getElementById('port').value);
        const url = `ws://${host}:${port}`;

        log(`【原始测试】尝试连接: ${url}`, 'warn');

        try {
            const ws = new WebSocket(url);

            ws.onopen = function() {
                log('【原始测试】WebSocket 连接成功!', 'success');
                log('【原始测试】发送 Pomelo 握手包...', 'info');

                // Pomelo 握手包格式: type(1) + body
                // type = 1 表示握手请求
                const handshakeBody = JSON.stringify({
                    sys: {
                        type: 'js-websocket',
                        version: '0.0.1',
                        rsa: {}
                    },
                    user: {}
                });

                // 构建握手包
                const bodyBytes = new TextEncoder().encode(handshakeBody);
                const buffer = new ArrayBuffer(4 + bodyBytes.length);
                const view = new DataView(buffer);

                // Pomelo 协议头: type(1byte) + length(3bytes)
                view.setUint8(0, 1);  // type = 1 (handshake)
                view.setUint8(1, (bodyBytes.length >> 16) & 0xff);
                view.setUint8(2, (bodyBytes.length >> 8) & 0xff);
                view.setUint8(3, bodyBytes.length & 0xff);

                // 复制 body
                const arr = new Uint8Array(buffer);
                arr.set(bodyBytes, 4);

                ws.send(buffer);
                log(`【原始测试】握手包已发送 (${buffer.byteLength} bytes)`, 'info');
            };

            ws.onmessage = function(event) {
                log('【原始测试】收到服务器响应!', 'success');

                if (event.data instanceof Blob) {
                    event.data.arrayBuffer().then(function(buffer) {
                        const view = new DataView(buffer);
                        const type = view.getUint8(0);
                        const len = (view.getUint8(1) << 16) + (view.getUint8(2) << 8) + view.getUint8(3);

                        log(`【原始测试】包类型: ${type}, 长度: ${len}`, 'info');

                        if (len > 0 && buffer.byteLength > 4) {
                            const bodyBytes = new Uint8Array(buffer, 4, len);
                            const bodyStr = new TextDecoder().decode(bodyBytes);
                            log(`【原始测试】响应内容: ${bodyStr}`, 'info');

                            try {
                                const json = JSON.parse(bodyStr);
                                log(`【原始测试】解析JSON: ${JSON.stringify(json, null, 2)}`, 'success');

                                // 检查错误码
                                if (json.code && json.code !== 200) {
                                    log(`【原始测试】服务器返回错误码: ${json.code}`, 'error');
                                }
                            } catch(e) {
                                log(`【原始测试】非JSON响应`, 'warn');
                            }
                        }
                    });
                } else {
                    log(`【原始测试】响应(文本): ${event.data}`, 'info');
                }
            };

            ws.onerror = function(e) {
                log(`【原始测试】WebSocket 错误: ${e.type}`, 'error');
                console.log('WebSocket错误详情:', e);
            };

            ws.onclose = function(e) {
                log(`【原始测试】连接关闭 - code: ${e.code}, reason: ${e.reason || '无'}`, 'warn');
            };

            // 5秒后关闭测试连接
            setTimeout(function() {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.close();
                    log('【原始测试】测试完成，连接已关闭', 'info');
                }
            }, 5000);

        } catch(e) {
            log(`【原始测试】创建WebSocket失败: ${e.message}`, 'error');
        }
    }

    // 页面加载完成
    log('Pomelo 客户端已初始化', 'info');
    log('请配置服务器地址后点击连接', 'info');
    log('提示：如果握手失败，点击"原始WebSocket测试"查看详情', 'warn');
</script>
</body>
</html>
