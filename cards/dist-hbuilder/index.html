    <script>
      /* 调试基座会缓存旧的 index.html / js。版本变了就清一次缓存再重启。 */
      (function () {
        var BUILD = 'no-mark-1'
        try {
          if (location.protocol !== 'file:') return
          if (localStorage.getItem('qipai_ui_build') === BUILD) return
          localStorage.setItem('qipai_ui_build', BUILD)
        } catch (e) {
          return
        }
        function wipe() {
          try {
            plus.cache.clear(function () {
              plus.runtime.restart()
            })
          } catch (e) {}
        }
        if (window.plus) wipe()
        else document.addEventListener('plusready', wipe)
      })()
